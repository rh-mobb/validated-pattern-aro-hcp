name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats unzip
          SHFMT_VERSION=v3.14.1
          curl -fsSL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          TFLINT_VERSION=v0.64.0
          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip" -o /tmp/tflint_linux_amd64.zip
          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/checksums.txt" -o /tmp/checksums.txt
          (cd /tmp && sha256sum --ignore-missing -c checksums.txt)
          unzip -o /tmp/tflint_linux_amd64.zip -d /usr/local/bin

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: make fmt lint test
        run: make fmt lint test
